---
name: Test

on:
  pull_request:
    branches:
      - "*"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        magento-versions:
          ["2.3.5ce", "2.4.0ce", "2.4.2ce", "2.4.4ce", "2.4.6ce", "2.4.7ce"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: magento2-extension

      - name: Login to GitLab
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.GITLAB_USER }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Build mage_node image
        shell: bash
        run: |
          cd magento2-extension/dev
          retries=3
          count=0
          until [ $count -ge $retries ]
          do
            DOCKER_BUILDKIT=1 docker build -f testv2/tools/docker/Dockerfile-mage-node --build-arg NPM_TOKEN=$NPM_TOKEN -t "mage_node" .  && break
            count=$((count+1))
            echo "Retrying build mage_node image ($count/$retries)..."
            sleep 30
          done
          if [ $count -ge $retries ]; then
            echo "mage_node image building failed after $retries attempts."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Run unit test
        shell: bash
        run: |
          cd magento2-extension
          retries=3
          count=0
          until [ $count -ge $retries ]
          do
            bash dev/testv2/tools/scripts/run-unit.sh && break
            count=$((count+1))
            echo "Retrying unit tests ($count/$retries)..."
            sleep 30
          done
          if [ $count -ge $retries ]; then
            echo "unit tests failed after $retries attempts."
            exit 1
          fi
        env:
          VERSION: ${{ matrix.magento-versions }}
          NPM_TOKEN: ${{ secrets.GITLAB_TOKEN }}

  e2e-tests:
    runs-on: ubuntu-latest
#    needs: unit-tests
    permissions:
      contents: "read"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        magento-versions:
          ["2.3.5ce", "2.4.0ce", "2.4.2ce", "2.4.4ce", "2.4.6ce", "2.4.7ce"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: magento2-extension

      - name: Login to GitLab
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.GITLAB_USER }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Build mage_node image
        shell: bash
        run: |
          cd magento2-extension/dev
          retries=3
          count=0
          until [ $count -ge $retries ]
          do
            DOCKER_BUILDKIT=1 docker build -f testv2/tools/docker/Dockerfile-mage-node --build-arg NPM_TOKEN=$NPM_TOKEN -t "mage_node" .  && break
            count=$((count+1))
            echo "Retrying build mage_node image ($count/$retries)..."
            sleep 30
          done
          if [ $count -ge $retries ]; then
            echo "mage_node image building failed after $retries attempts."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Run e2e test
        shell: bash
        run: |
          cd magento2-extension
          retries=3
          count=0
          until [ $count -ge $retries ]
          do
            bash dev/testv2/tools/scripts/run-e2e.sh && break
            count=$((count+1))
            echo "Retrying e2e tests ($count/$retries)..."
            sleep 30
          done
          if [ $count -ge $retries ]; then
            echo "e2e tests failed after $retries attempts."
            exit 1
          fi
        env:
          VERSION: ${{ matrix.magento-versions }}
          NPM_TOKEN: ${{ secrets.GITLAB_TOKEN }}
